name: Update mods

# Manual only. There is deliberately no `schedule:` trigger and no "update everything" mode:
# automatic and bulk updates pulled in releases that broke things and replaced betas chosen on purpose.
#   mode=scan    check every mod on Modrinth + CurseForge, write updates.json for the Pages console
#   mode=update  update exactly the mods in `mods` (slug@version,... from updates.json), then rescan
#   bump_neoforge  move NeoForge to the newest 21.1.x (same Minecraft); combine with either mode
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = list updates; update = update the mods listed below"
        type: choice
        options: [scan, update]
        default: scan
      mods:
        description: "update mode: slug@version,... (Modrinth version id / CurseForge file id from updates.json)"
        type: string
        default: ""
      bump_neoforge:
        description: "Also bump NeoForge to latest 21.1.x (same MC)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: update-mods
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve NeoForge latest 21.1.x
        id: nf
        run: |
          set -euo pipefail
          META=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml)
          LATEST_211=$(echo "$META" | grep -oE '21\.1\.[0-9]+' | sort -t. -k3 -n | tail -1)
          CURRENT=$(sed -n 's/^neoforge *= *"\([^"]*\)".*/\1/p' pack.toml | head -1)
          echo "latest_211=$LATEST_211" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Setup Go (NeoForge bump only)
        if: ${{ inputs.bump_neoforge }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Bump NeoForge
        if: ${{ inputs.bump_neoforge }}
        run: |
          set -euo pipefail
          go install github.com/packwiz/packwiz@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          TARGET="${{ steps.nf.outputs.latest_211 }}"
          if [ "${{ steps.nf.outputs.current }}" != "$TARGET" ]; then packwiz migrate loader "$TARGET" -y; fi

      - name: Update the chosen mods
        if: ${{ inputs.mode == 'update' }}
        env:
          MODS: ${{ inputs.mods }}
        run: python3 scripts/update_channel.py --only "$MODS"

      - name: Scan for updates
        run: python3 scripts/update_channel.py --scan

      - name: Write status.json
        env:
          NF_LATEST: ${{ steps.nf.outputs.latest_211 }}
        run: |
          python3 - <<'PY'
          import json, datetime, re, pathlib, os
          pack = pathlib.Path("pack.toml").read_text(encoding="utf-8")
          pathlib.Path("status.json").write_text(json.dumps({
            "minecraft": re.search(r'^minecraft\s*=\s*"([^"]+)"', pack, re.M).group(1),
            "neoforge": re.search(r'^neoforge\s*=\s*"([^"]+)"', pack, re.M).group(1),
            "neoforge_latest_same_mc": os.environ.get("NF_LATEST", ""),
            "neoforge_line": "21.1.x",
            "policy": "No automatic or bulk updates. Mods are updated one at a time from the Pages console (or workflow_dispatch mode=update).",
            "checked_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "mfpack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .update-summary ]; then MSG="chore: update $(cat .update-summary)"; rm .update-summary
          elif [ "${{ inputs.bump_neoforge }}" = "true" ]; then MSG="chore: NeoForge ${{ steps.nf.outputs.latest_211 }}"
          else MSG="chore: scan for updates"; fi
          git add -A
          if git diff --staged --quiet; then echo "No changes."; else git commit -m "$MSG" && git push; fi
