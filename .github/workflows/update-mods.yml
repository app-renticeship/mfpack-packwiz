name: Update mods

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Max release channel (release=stable only)"
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release
      bump_neoforge:
        description: "Also bump NeoForge to latest 21.1.x (same MC)"
        type: boolean
        default: false
      update_mods:
        description: "Run channel-aware mod updates"
        type: boolean
        default: true
  # Auto schedule disabled — release-channel cron was yanking intentional
  # betas (CEI, Crafts & Additions, etc.) and desyncing clients/server.
  # Run manually via Actions → Update mods when you want an update.

permissions:
  contents: write
  actions: read

concurrency:
  group: update-mods
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Resolve NeoForge latest 21.1.x
        id: nf
        run: |
          set -euo pipefail
          META=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml)
          LATEST_211=$(echo "$META" | grep -oE '21\.1\.[0-9]+' | sort -t. -k3 -n | tail -1)
          CURRENT=$(sed -n 's/^neoforge *= *"\([^"]*\)".*/\1/p' pack.toml | head -1)
          echo "latest_211=$LATEST_211" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current NeoForge=$CURRENT  latest 21.1.x=$LATEST_211"

      - name: Bump NeoForge (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_neoforge }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          TARGET="${{ steps.nf.outputs.latest_211 }}"
          CURRENT="${{ steps.nf.outputs.current }}"
          if [ "$CURRENT" != "$TARGET" ]; then
            packwiz migrate loader "$TARGET" -y
          else
            echo "NeoForge already at $TARGET"
          fi

      - name: Update mods (channel-aware)
        if: ${{ github.event_name == 'schedule' || inputs.update_mods }}
        env:
          CHANNEL: ${{ github.event_name == 'schedule' && 'release' || inputs.channel || 'release' }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "Updating with channel=$CHANNEL"
          python3 scripts/update_channel.py --channel "$CHANNEL"

      - name: Write status.json for Pages
        env:
          NF_LATEST: ${{ steps.nf.outputs.latest_211 }}
          CHANNEL: ${{ github.event_name == 'schedule' && 'release' || inputs.channel || 'release' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, datetime, re, pathlib, os
          pack = pathlib.Path("pack.toml").read_text(encoding="utf-8")
          current = re.search(r'^neoforge\s*=\s*"([^"]+)"', pack, re.M).group(1)
          mc = re.search(r'^minecraft\s*=\s*"([^"]+)"', pack, re.M).group(1)
          pathlib.Path("status.json").write_text(json.dumps({
            "minecraft": mc,
            "neoforge": current,
            "neoforge_latest_same_mc": os.environ.get("NF_LATEST", ""),
            "neoforge_line": "21.1.x",
            "last_update_channel": os.environ.get("CHANNEL", "release"),
            "policy": "Scheduled auto-updates are OFF. Run workflow_dispatch manually when updating. Prefer channel=beta (or per-mod overrides in channel-overrides.json) so intentional betas are not yanked to older stables. NeoForge only bumps within 21.1.x when bump_neoforge is checked.",
            "checked_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "mfpack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: packwiz channel update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "## Packwiz update"
            echo "- Channel: \`${{ inputs.channel || 'release' }}\`"
            echo "- NeoForge: \`${{ steps.nf.outputs.current }}\` (latest 21.1.x \`${{ steps.nf.outputs.latest_211 }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
